name: Generate Android signing keystore (one-time)

# Run manually once to create a stable debug-signing keystore, so the SHA-1 fingerprint
# registered with Google Sign-In stays valid across every future build — the default debug
# keystore Gradle auto-generates is recreated fresh on every CI run, which would silently
# break native Google Sign-In again on the very next build.
#
# Before running this: add a repo secret named ANDROID_KEYSTORE_PASSWORD (any strong random
# string) in Settings > Secrets and variables > Actions.
#
# After running this: open the run's log, copy the printed base64 blob into a new repo secret
# named ANDROID_KEYSTORE_BASE64, and copy the printed SHA-1 fingerprint into the new "Android"
# OAuth client in Google Cloud Console. Then delete this run's log (it's the only place the
# keystore blob appears in plain text) and this workflow file, since it's a one-time setup step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate keystore
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias mannyeon \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=Mannyeon Diary, OU=Personal, O=Mannyeon, L=Seoul, ST=Seoul, C=KR"
      - name: Print base64 (copy this into the ANDROID_KEYSTORE_BASE64 secret)
        run: base64 -w0 release.keystore
      - name: Print SHA-1 / SHA-256 fingerprints (for the Google Cloud Console Android OAuth client)
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore release.keystore -storepass "$STOREPASS"
